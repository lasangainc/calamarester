#
# Calamares settings for end-to-end installer testing.
# Use with: cd "$BUILDDIR" && sudo ./calamares -d -c /path/to/ci/e2e/config
#
# Target disk: set CALAMARES_E2E_DISK (default /dev/vdb on Cursor Cloud VMs).
# That device is fully erased when you choose "Erase disk" in the UI.
---
# "local" resolves plugin modules from the build tree when calamares -d is used
# with cwd=$BUILDDIR (see Settings.cpp interpretModulesSearch).
modules-search: [ local ]

sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - partition
  - usersq
  - summaryq
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - initramfs
  - bootloader
  - umount
- show:
  - finishedq

branding: esteros

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
