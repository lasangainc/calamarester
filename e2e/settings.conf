#
# End-to-end install configuration for esterOS branding.
# Use with: sudo ./calamares -d -c /workspace/e2e
# Run from the build directory so ./example.sqfs resolves correctly.
---
modules-search: [ local ]

sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - partition
  - usersq
  - summaryq
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - users
  - umount
- show:
  - finishedq

branding: esteros

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
